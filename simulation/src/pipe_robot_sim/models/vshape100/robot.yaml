# V자형 100mm 배관 로봇 (arXiv 2603.27245). 모양은 vshape100.urdf.xacro
# 모터·엔코더 값은 논문에 없음 -> 추정 (docs/08)
/**:
  ros__parameters:
    wheel_joints: [front_left_omni_joint, front_right_omni_joint, rear_left_omni_joint, rear_right_omni_joint]
    wheel_radius: 0.030           # 옴니휠 반경 (논문)
    encoder_cpr: 2800             # 추정
    motor_stall_torque: 0.3       # 바퀴당 [N·m], 추정 (xacro wheel_damping 과 같게)
    motor_no_load_speed: 10.0     # [rad/s], 추정
    supply_voltage: 12.0          # 추정
    rated_voltage: 12.0
    roll_joints: [roll_wheel_joint]   # 구형 바퀴 굴림 모터 (토크 입력, 제어 노드는 아직 없음)
    spawn_x: 0.13                 # 뒤 옴니휠 끝(O에서 -0.105 m)이 입구 안쪽에 들어가게
    body_len: 0.105
    tof: false
    bench_spines: [base_link, link2]
